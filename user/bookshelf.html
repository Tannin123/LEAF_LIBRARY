<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tủ sách cá nhân - LEAF LIBRARY</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/admin.css">
	<link rel="stylesheet" href="../css/user.css">
</head>
<body class="user-interface bookshelf-page">
	<div class="app-wrapper">
		<header class="header-container navbar">
			<div class="header-logo" id="sidebarToggle" title="Thu gọn / Mở rộng menu">
				<img class="logo-full" src="../assets/images/logo-leaflibrary.png" alt="Leaf Library Logo" draggable="false">
				<img class="logo-compact" src="../assets/images/logo-leaf.png" alt="Leaf Library Logo" draggable="false">
			</div>
			<div class="header-greeting">
				<span class="greeting-hello">hello,</span>
				<span class="greeting-name" id="headerGreetingName">Lưu Tấn Nin</span>
			</div>
			<div class="header-user" id="headerUserContainer">
				<div class="user-avatar-circle" id="btnUserAvatar" title="Tài khoản của tôi">
					<svg id="headerAvatarDefaultIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
					<img id="headerAvatarImg" class="avatar-img-fill" src="" alt="Avatar" style="display: none;">
				</div>
				<div class="user-dropdown-menu" id="userDropdownMenu">
					<div class="user-dropdown-header">
						<div class="user-dropdown-name" id="dropdownUserName">Lưu Tấn Nin</div>
						<div class="user-dropdown-meta"><span id="dropdownUserCode">Mã ĐG: 123456</span><span class="badge status-badge badge-reader-valid" id="dropdownUserRole">Độc giả</span></div>
					</div>
					<button type="button" class="user-dropdown-item" id="btnOpenMyAccount"><span>Thông tin tài khoản</span></button>
					<button type="button" class="user-dropdown-item" id="btnOpenChangePassword"><span>Đổi mật khẩu</span></button>
					<div class="user-dropdown-divider"></div>
					<button type="button" class="user-dropdown-item logout-item" id="btnUserLogout"><span>Đăng xuất</span></button>
				</div>
			</div>
		</header>
		<div class="main-body">
			<aside class="sidebar-menu admin-sidebar" id="sidebarMenu">
				<a href="index.html" class="sidebar-item" title="Trang chủ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Trang chủ</span></a>
				<a href="catalog.html" class="sidebar-item" title="Tra cứu sách"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Tra cứu sách</span></a>
				<a href="bookshelf.html" class="sidebar-item active" title="Tủ sách cá nhân"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>Tủ sách cá nhân</span></a>
				<a href="history.html" class="sidebar-item" title="Lịch sử mượn/trả"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>Lịch sử mượn/trả</span></a>
				<a href="penalties.html" class="sidebar-item" title="Thanh toán"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg><span>Thanh toán</span></a>
				<a href="suggestions.html" class="sidebar-item" title="Đề xuất sách"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span>Đề xuất sách</span></a>
			</aside>
			<main class="content-section user-dashboard-section bookshelf-main">
				<div class="user-dash-topbar">
					<label class="bookshelf-search">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
						<input type="search" id="bookshelfSearchInput" placeholder="Tìm kiếm sách trong tủ sách..." aria-label="Tìm sách trong tủ sách">
					</label>
					<div class="user-dash-actions">
						<button type="button" class="topbar-icon-btn" title="Tin nhắn" aria-label="Tin nhắn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg></button>
						<button type="button" class="topbar-icon-btn" id="btnNotification" title="Thông báo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="topbar-badge badge-red">2</span></button>
					</div>
				</div>
		<section class="bookshelf-content" aria-labelledby="bookshelfTitle">
			<header class="bookshelf-heading-row">
				<div>
					<h1 id="bookshelfTitle">Tủ sách cá nhân</h1>
					<p>Quản lý những cuốn sách bạn đang đọc và yêu thích.</p>
				</div>
				<div class="bookshelf-controls">
					<label class="bookshelf-filter-control">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M7 12h10m-7 7h4"/></svg>
						<select id="bookshelfStatusFilter" aria-label="Lọc sách theo trạng thái">
							<option value="all">Tất cả trạng thái</option>
							<option value="Đang đọc">Đang đọc</option>
							<option value="Đã đọc">Đã đọc</option>
							<option value="Chưa đọc">Chưa đọc</option>
						</select>
					</label>
					<button type="button" class="bookshelf-add-button" id="btnOpenAddToBookshelf">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
						<span>Thêm vào tủ sách</span>
					</button>
				</div>
			</header>
			<div class="bookshelf-book-list" id="bookshelfBookList" aria-live="polite"></div>
		</section>
			</main>
		</div>
	</div>

	<div class="modal-overlay" id="modalAddToBookshelf">
		<div class="modal-box bookshelf-add-modal" role="dialog" aria-modal="true" aria-labelledby="addToBookshelfTitle">
			<div class="user-modal-header">
				<h2 class="user-modal-title" id="addToBookshelfTitle">THÊM SÁCH VÀO TỦ</h2>
				<button type="button" class="user-modal-close-btn" id="btnCloseAddToBookshelf" aria-label="Đóng">✕</button>
			</div>
			<form class="bookshelf-add-form" id="formAddToBookshelf">
				<div class="bookshelf-add-layout">
					<aside class="bookshelf-add-preview">
						<div class="bookshelf-add-cover"><img id="bookshelfAddBookCover" src="" alt="Bìa sách"></div>
						<strong id="bookshelfAddBookPreviewTitle"></strong>
						<span class="bookshelf-add-stock">Còn sẵn</span>
						<small id="bookshelfAddBookPreviewMeta"></small>
					</aside>
					<div class="bookshelf-add-fields">
						<p class="bookshelf-add-section-title">Thông tin tài liệu</p>
						<label for="bookshelfAddBookSelect">Sách cần thêm</label>
						<select id="bookshelfAddBookSelect" required></select>
						<label for="bookshelfAddDate">Ngày thêm vào tủ</label>
						<input type="date" id="bookshelfAddDate" required>
						<label for="bookshelfAddNote">Ghi chú cá nhân</label>
						<textarea id="bookshelfAddNote" rows="3" placeholder="Ghi chú của bạn..."></textarea>
					</div>
				</div>
				<div class="bookshelf-add-actions">
					<button type="button" class="bookshelf-cancel-button" id="btnCancelAddToBookshelf">Hủy</button>
					<button type="submit" class="bookshelf-add-button">Thêm vào tủ sách</button>
				</div>
			</form>
		</div>
	</div>

	<div class="modal-overlay" id="modalEditShelfEntry">
		<div class="modal-box bookshelf-edit-modal" role="dialog" aria-modal="true" aria-labelledby="editShelfEntryTitle">
			<div class="user-modal-header">
				<h2 class="user-modal-title" id="editShelfEntryTitle">CHỈNH SỬA TIẾN ĐỘ ĐỌC</h2>
				<button type="button" class="user-modal-close-btn" id="btnCloseEditShelfEntry" aria-label="Đóng">✕</button>
			</div>
			<form class="bookshelf-edit-form" id="formEditShelfEntry">
				<p id="editShelfBookTitle"></p>
				<label for="editShelfStatus">Trạng thái</label>
				<select id="editShelfStatus" required>
					<option value="Chưa đọc">Chưa đọc</option>
					<option value="Đang đọc">Đang đọc</option>
					<option value="Đã đọc">Đã đọc</option>
				</select>
				<div class="bookshelf-edit-page-fields">
					<label for="editShelfCurrentPage">Trang hiện tại</label>
					<input id="editShelfCurrentPage" type="number" min="0" required>
					<label for="editShelfTotalPages">Tổng số trang</label>
					<input id="editShelfTotalPages" type="number" min="0" required>
				</div>
				<div class="bookshelf-add-actions">
					<button type="button" class="bookshelf-cancel-button" id="btnCancelEditShelfEntry">Hủy</button>
					<button type="submit" class="bookshelf-add-button">Lưu thay đổi</button>
				</div>
			</form>
		</div>
	</div>

	<div class="toast-container" id="toastContainer"></div>
	<script src="../js/data.js"></script>
	<script src="../js/user.js"></script>
</body>
</html>
