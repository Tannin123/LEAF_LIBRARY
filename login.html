<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEAF LIBRARY - Cổng Đăng Nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="container">
        
        <div id="form-login" class="card active">
            <div class="header">
                <div class="logo-icon">
                    <img class="logo-img" src="assets/images/logo-leaflibrary.png" alt="Leaf Library Logo" draggable="false">
                 </div>
                <div class="subtitle">Hệ thống Quản lý Thư viện</div>
            </div>
            
            <div class="input-group">
                <label for="demo-login-email">Tên đăng nhập, Email hoặc SĐT</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user left-icon" aria-hidden="true"></i>
                    <input type="text" id="demo-login-email" autocomplete="username" placeholder="Ví dụ: tannin hoặc email@gmail.com">
                </div>
                <div id="err-login-username" class="field-error" role="alert"></div>
            </div>
            
            <div class="input-group">
                <label for="demo-login-pwd">Mật khẩu</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock left-icon" aria-hidden="true"></i>
                    <input type="password" id="demo-login-pwd" autocomplete="current-password" placeholder="Nhập mật khẩu...">
                    <button type="button" class="password-toggle-btn" aria-label="Hiển thị hoặc ẩn mật khẩu" onclick="togglePassword(this)">
                        <i class="fa-regular fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
                <div id="err-login-pwd" class="field-error" role="alert"></div>
            </div>
            
            <div class="actions-row">
            </div>

            <div id="login-success" class="success-msg" role="status" aria-live="polite"></div>
            <div id="login-error" class="error-msg" role="alert"></div>

            <button type="button" id="btn-login-submit" class="btn btn-primary" onclick="handleLogin()">Đăng nhập</button>
            
            <div class="bottom-links">
                Chưa có tài khoản? <a href="#" onclick="switchForm('form-register'); return false;">Đăng ký ngay</a>
            </div>
        </div>

        <div id="form-register" class="card">
            <div class="header">
                <div class="logo-icon">
                    <img class="logo-img" src="assets/images/logo-leaflibrary.png" alt="Leaf Library Logo" draggable="false">
                </div>
                <div class="subtitle">Đăng ký tài khoản bạn đọc</div>
            </div>
            
            <div class="input-group">
                <label for="reg-name">Họ và tên <span aria-hidden="true">*</span></label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user left-icon" aria-hidden="true"></i>
                    <input type="text" id="reg-name" autocomplete="name" placeholder="Nguyễn Văn A">
                </div>
                <div id="err-reg-name" class="field-error" role="alert"></div>
            </div>
            
            <div class="input-group">
                <label for="reg-phone">Số điện thoại <span aria-hidden="true">*</span></label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone left-icon" aria-hidden="true"></i>
                    <input type="tel" id="reg-phone" autocomplete="tel" placeholder="0912345678 (10 chữ số)">
                </div>
                <div id="err-reg-phone" class="field-error" role="alert"></div>
            </div>

            <div class="input-group">
                <label for="reg-cccd">Số CCCD / CMND (tùy chọn)</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-id-card left-icon" aria-hidden="true"></i>
                    <input type="text" id="reg-cccd" placeholder="9 hoặc 12 chữ số">
                </div>
                <div id="err-reg-cccd" class="field-error" role="alert"></div>
            </div>

            <div class="input-group">
                <label for="reg-email">Tên đăng nhập hoặc Email <span aria-hidden="true">*</span></label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope left-icon" aria-hidden="true"></i>
                    <input type="text" id="reg-email" autocomplete="username" placeholder="bandoc@leaflibrary.vn">
                </div>
                <div class="field-hint">Tài khoản đăng ký mới được cấp quyền Bạn đọc (Sinh viên) theo quy định thư viện.</div>
                <div id="err-reg-email" class="field-error" role="alert"></div>
            </div>

            <div class="input-group">
                <label for="reg-pwd">Mật khẩu <span aria-hidden="true">*</span></label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock left-icon" aria-hidden="true"></i>
                    <input type="password" id="reg-pwd" autocomplete="new-password" placeholder="Tối thiểu 8 ký tự">
                    <button type="button" class="password-toggle-btn" aria-label="Hiển thị hoặc ẩn mật khẩu" onclick="togglePassword(this)">
                        <i class="fa-regular fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
                <div id="err-reg-pwd" class="field-error" role="alert"></div>
            </div>

            <div class="input-group">
                <label for="reg-pwd-confirm">Xác nhận mật khẩu <span aria-hidden="true">*</span></label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock left-icon" aria-hidden="true"></i>
                    <input type="password" id="reg-pwd-confirm" autocomplete="new-password" placeholder="Nhập lại mật khẩu">
                    <button type="button" class="password-toggle-btn" aria-label="Hiển thị hoặc ẩn mật khẩu xác nhận" onclick="togglePassword(this)">
                        <i class="fa-regular fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
                <div id="err-reg-pwd-confirm" class="field-error" role="alert"></div>
            </div>
            
            <div class="actions-row reg-terms" style="margin-bottom: 15px;">
                <label class="checkbox-label" style="align-items: flex-start;">
                    <input type="checkbox" id="reg-terms" style="margin-top: 3px;" checked> 
                    <span>Tôi đồng ý với Điều khoản sử dụng và Quy định bảo mật</span>
                </label>
            </div>
            
            <div id="register-error" class="error-msg" role="alert"></div>
            
            <button type="button" id="btn-register-submit" class="btn btn-primary" onclick="validateRegister()">Đăng ký tài khoản</button>
            
            <div class="bottom-links" style="margin-bottom: 0;">
                <a href="#" onclick="switchForm('form-login'); return false;">← Quay lại Đăng nhập</a>
            </div>
        </div>


    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
