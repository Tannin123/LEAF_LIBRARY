services:
  db:
    image: postgres:17-alpine
    container_name: ixs-library-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Nin10112006}
    ports:
      - "5434:5432"
    volumes:
      - postgres_erd_data:/var/lib/postgresql/data
      - ./database/QuanLyThuVien_PostgreSQL.sql:/docker-entrypoint-initdb.d/001-library.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    container_name: ixs-library-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: admin
      DB_PASSWORD: ${DB_PASSWORD:-Nin10112006}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ixs-library-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@leaflibrary.vn
      PGADMIN_DEFAULT_PASSWORD: Nin10112006
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_erd_data:
