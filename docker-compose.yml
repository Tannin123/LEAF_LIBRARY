services:
  db:
    image: postgres:17-alpine
    container_name: ixs-library-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ixs_library
      POSTGRES_USER: ixs_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/library_db.sql:/docker-entrypoint-initdb.d/001-library.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ixs_app -d ixs_library"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    container_name: ixs-library-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ixs_library
      DB_USER: ixs_app
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      EOTP_API_KEY: ${EOTP_API_KEY:-}
      EOTP_API_SECRET: ${EOTP_API_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
